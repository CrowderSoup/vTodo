# Kamal 2 deploy config for vtodo (vtodo.crowdersoup.com + mcp.vtodo.crowdersoup.com)
#
# vtodo owns Redis for the crowder-cloud droplet. Boot it before deploying padd:
#   kamal accessory boot redis
# It requires a password (REDIS_PASSWORD). Every app's redis:// URL carries it:
#   redis://:<REDIS_PASSWORD>@vtodo-redis:6379/<db>

service: vtodo
image: crowdersoup/vtodo

servers:
  web:
    hosts:
      - 64.23.247.60
    proxy:
      ssl: true
      host: vtodo.crowdersoup.com
      app_port: 8000
      healthcheck:
        path: /up/
  mcp:
    hosts:
      - 64.23.247.60
    cmd: "uv run python -m mcp_server"
    proxy:
      ssl: true
      host: mcp.vtodo.crowdersoup.com
      app_port: 8001
      healthcheck:
        path: /up
    env:
      clear:
        VTODO_API_URL: https://vtodo.crowdersoup.com
        VTODO_MCP_TRANSPORT: sse
        # VTODO_MCP_PUBLIC_URL is in the shared env below. No API/MCP secrets
        # needed here: each caller authorizes via OAuth
        # (config/settings.py:OAUTH2_PROVIDER), and mcp_server forwards that
        # caller's token to the API.
  worker:
    hosts:
      - 64.23.247.60
    # Worker + embedded beat in one process -- fine at this scale, avoids running
    # two Kamal roles for what's currently a single periodic task (Skylight sync).
    cmd: "uv run celery -A config worker -B -l info"

registry:
  server: ghcr.io
  username: crowdersoup
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

ssh:
  user: deploy
  keys:
    - ~/.ssh/crowder-cloud

env:
  clear:
    DEBUG: "False"
    # Must match the streamable_http_path Claude actually hits ("/mcp"). It's
    # the OAuth resource identifier (RFC 8707/9728) for mcp_server, and the
    # web role needs it too: the API accepts tokens with this audience
    # (apps/api/views.py:validate_api_resource_token).
    VTODO_MCP_PUBLIC_URL: https://mcp.vtodo.crowdersoup.com/mcp
    ALLOWED_HOSTS: vtodo.crowdersoup.com,localhost,127.0.0.1,*
    CSRF_TRUSTED_ORIGINS: https://vtodo.crowdersoup.com
    EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
    EMAIL_HOST: smtppro.zoho.com
    EMAIL_PORT: "465"
    EMAIL_HOST_USER: aaron@crowder.cloud
    EMAIL_USE_SSL: "True"
    DEFAULT_FROM_EMAIL: Aaron <aaron@crowder.cloud>
    ADMIN_EMAILS: aaron.crowder@gmail.com
  secret:
    - SECRET_KEY
    - DATABASE_URL
    - CELERY_BROKER_URL   # redis://:<REDIS_PASSWORD>@vtodo-redis:6379/0
    - EMAIL_HOST_PASSWORD
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET
    - INTEGRATIONS_ENCRYPTION_KEY

accessories:
  redis:
    # Pinned to a patched release (7.4.11 fixes CVE-2026-81934) instead of the
    # floating redis:7 tag, which only moves on the next `accessory reboot`.
    image: redis:7.4.11
    host: 64.23.247.60
    # Apps reach Redis as vtodo-redis on the kamal Docker network. The host
    # port is bound to localhost only: Docker's published ports bypass ufw,
    # so 0.0.0.0 left the DigitalOcean cloud firewall as the only guard.
    port: "127.0.0.1:6379:6379"
    # redis-server can't read requirepass from the environment, so write it
    # to a config file at startup. That keeps it out of the process args.
    # The single quotes stop the host shell (Kamal runs this line over ssh)
    # from expanding $REDIS_PASSWORD; the container's sh expands it from the
    # env file. docker-entrypoint.sh still drops to the redis user.
    cmd: "sh -c 'umask 077 && printf \"requirepass %s\\n\" \"$REDIS_PASSWORD\" > /data/redis-auth.conf && chown redis:redis /data/redis-auth.conf && exec docker-entrypoint.sh redis-server /data/redis-auth.conf'"
    env:
      secret:
        - REDIS_PASSWORD
    directories:
      - data:/data
