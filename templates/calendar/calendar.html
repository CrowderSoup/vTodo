{% extends "base.html" %}

{% block body_class %}page-calendar{% endblock %}
{% block title %}Calendar — vtodo{% endblock %}

{% block content %}
<section class="page-shell">
  <div class="calendar-nav">
    <a class="btn-ghost btn-small" href="?year={{ prev_year }}&month={{ prev_month }}" aria-label="Previous month">‹ Prev</a>
    <h2 class="calendar-month-label">{{ month_label }}</h2>
    <a class="btn-ghost btn-small" href="?year={{ today_year }}&month={{ today_month }}">Today</a>
    <a class="btn-ghost btn-small" href="?year={{ next_year }}&month={{ next_month }}" aria-label="Next month">Next ›</a>
  </div>

  <div id="task-list-content" class="calendar-layout">
    {% include "calendar/_calendar_body.html" %}
  </div>

  <button class="board-fab"
          type="button"
          title="Add task"
          aria-label="Add task"
          hx-get="{% url 'boards:task-panel-create' %}"
          hx-target="#task-panel-content"
          hx-swap="innerHTML"
          hx-on::after-request="openTaskPanel()">
    <span class="board-fab-mark">+</span>
    <span class="board-fab-label">New task</span>
  </button>
</section>
{% endblock %}
