{% if done_task_count and can_write_workspace %}
<form hx-post="{% url 'boards:board-archive-done' %}"
      hx-target="#task-list-content"
      hx-swap="innerHTML"
      hx-confirm="Archive {{ done_task_count }} done card{{ done_task_count|pluralize }}?">
  <input type="hidden" name="board_id" value="{{ board.pk }}">
  <button type="submit" class="btn-ghost btn-small">Archive done cards ({{ done_task_count }})</button>
</form>
{% endif %}
