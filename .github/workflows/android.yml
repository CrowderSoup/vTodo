name: Android

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    env:
      VTODO_RELEASE_KEYSTORE_BASE64: ${{ secrets.VTODO_RELEASE_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;35.0.0 build-tools;36.0.0

      - uses: gradle/actions/setup-gradle@v6

      - name: Test and build
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug

      # The debug APK is signed with the public key in android/app/debug.keystore,
      # so it is only a build check and is not uploaded. A release APK is built
      # once the signing secrets are set (see README, Android).
      - name: Build signed release APK
        if: env.VTODO_RELEASE_KEYSTORE_BASE64 != ''
        working-directory: android
        env:
          VTODO_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.VTODO_RELEASE_KEYSTORE_PASSWORD }}
          VTODO_RELEASE_KEY_ALIAS: ${{ secrets.VTODO_RELEASE_KEY_ALIAS }}
          VTODO_RELEASE_KEY_PASSWORD: ${{ secrets.VTODO_RELEASE_KEY_PASSWORD }}
        run: |
          echo "$VTODO_RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          VTODO_RELEASE_KEYSTORE="$RUNNER_TEMP/release.jks" ./gradlew :app:assembleRelease
          rm "$RUNNER_TEMP/release.jks"
          cp app/build/outputs/apk/release/app-release.apk ../vtodo.apk

      - uses: actions/upload-artifact@v7
        if: env.VTODO_RELEASE_KEYSTORE_BASE64 != ''
        with:
          path: vtodo.apk
          if-no-files-found: error
          archive: false
